<!-- Google Consent Mode v2: todo denegado por defecto (RGPD) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    'analytics_storage': 'denied',
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });

  // Carga GTM (conversiones Google Ads) + GA4 solo tras consentimiento explícito.
  window.ampLoadGoogleTags = function() {
    if (window.__ampGtmLoaded) return;
    window.__ampGtmLoaded = true;

    gtag('consent', 'update', {
      'analytics_storage': 'granted',
      'ad_storage': 'granted',
      'ad_user_data': 'granted',
      'ad_personalization': 'granted'
    });

    // GTM: contenedor con etiquetas de conversión de Google Ads
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','{{ .Site.Params.google.tagManager.gtmTag }}');

    // GA4 directo (no está configurado dentro del contenedor GTM)
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.google.tagManager.globalTag }}';
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', '{{ .Site.Params.google.tagManager.globalTag }}');
  };

  // El valor se guarda como "accepted|<timestamp>"; la caducidad la gestiona cookie-consent.html
  if ((localStorage.getItem('amp-cookie-consent') || '').indexOf('accepted') === 0) {
    window.ampLoadGoogleTags();
  }
</script>
