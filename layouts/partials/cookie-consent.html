<!-- Banner de consentimiento de cookies (RGPD / LSSI) -->
<div id="cookie-banner" class="hidden fixed bottom-0 inset-x-0 z-50 bg-slate-900 text-slate-100 shadow-2xl" role="dialog" aria-modal="false" aria-label="Aviso de cookies" aria-describedby="cookie-banner-text">
    <div class="max-w-5xl mx-auto px-4 py-4 md:py-5 flex flex-col md:flex-row md:items-center gap-4">
        <p id="cookie-banner-text" class="text-sm leading-relaxed flex-1">
            Utilizamos cookies de análisis (Google Analytics) y de medición de conversiones (Google Ads) para entender cómo se usa la web y mejorarla.
            Solo se instalarán si las aceptas. Consulta la
            <a href="/cookies/" class="underline hover:text-white">política de cookies</a>.
        </p>
        <div class="flex gap-3 shrink-0">
            <button id="cookie-reject" type="button"
                class="px-5 py-2.5 rounded-lg border border-slate-500 text-sm font-semibold hover:bg-slate-800 transition-colors">
                Rechazar
            </button>
            <button id="cookie-accept" type="button"
                class="px-5 py-2.5 rounded-lg bg-accent-500 hover:bg-accent-600 text-white text-sm font-semibold transition-colors">
                Aceptar
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    var KEY = 'amp-cookie-consent';
    // La AEPD recomienda renovar el consentimiento como máximo cada 24 meses; usamos 12.
    var MAX_AGE_MS = 365 * 24 * 60 * 60 * 1000;
    var banner = document.getElementById('cookie-banner');
    if (!banner) return;

    function readConsent() {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var parts = raw.split('|');
        var value = parts[0];
        var ts = parseInt(parts[1], 10);
        // Valores antiguos sin timestamp o caducados: se piden de nuevo
        if ((value !== 'accepted' && value !== 'rejected') || !ts || Date.now() - ts > MAX_AGE_MS) {
            localStorage.removeItem(KEY);
            return null;
        }
        return value;
    }

    function choose(value) {
        localStorage.setItem(KEY, value + '|' + Date.now());
        banner.classList.add('hidden');
        if (value === 'accepted' && window.ampLoadGoogleTags) {
            window.ampLoadGoogleTags();
        }
    }

    document.getElementById('cookie-accept').addEventListener('click', function() { choose('accepted'); });
    document.getElementById('cookie-reject').addEventListener('click', function() { choose('rejected'); });

    // Permite retirar/cambiar el consentimiento (enlace "Configurar cookies" del footer)
    var settingsLink = document.getElementById('cookie-settings');
    if (settingsLink) {
        settingsLink.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem(KEY);
            banner.classList.remove('hidden');
            banner.scrollIntoView({ behavior: 'smooth', block: 'end' });
        });
    }

    if (!readConsent()) banner.classList.remove('hidden');
})();
</script>
